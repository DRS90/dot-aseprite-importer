[plugin]

name="Aseprite Top-Down Grid Animations"
description="Imports .aseprite sprites drawn as a 3x3 grid of facing directions, or with no direction at all, as SpriteFrames timed like in Aseprite, syncs their animations into an AnimationPlayer, and imports any .aseprite as a Texture2D."
