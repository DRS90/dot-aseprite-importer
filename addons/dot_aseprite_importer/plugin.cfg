[plugin]

name="Dot Aseprite Importer"
description="Imports .aseprite files as SpriteFrames timed like in Aseprite, packed into one sheet with nothing written to the project, syncs their animations into an AnimationPlayer, and imports any .aseprite as a Texture2D. Sprites drawn as a 3x3 grid of facing directions give one animation per direction."
author="Douglas Rodrigo dos Santos"
version="0.1.1"
script="plugin.gd"
